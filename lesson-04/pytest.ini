[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
log_cli = true
log_level = DEBUG
markers =
    auth: authentication endpoint tests
    products: product catalog endpoint tests
    orders: order management endpoint tests
    health: service health check tests
    llm: AI and embedding tests
    slow: tests taking longer than 2 seconds
